name: Release Firefox extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web-ext
        run: npm install --global web-ext

      - name: Prepare extension source
        id: extension
        run: |
          set -euo pipefail

          version="$(node -p "require('./manifest.json').version")"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "${tag_version}" != "${version}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version${version}." >&2
              exit 1
            fi
          fi

          mkdir -p build/extension
          cp manifest.json *.html *.css *.js build/extension/
          cp -R icons build/extension/icons

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Lint extension
        run: web-ext lint --source-dir build/extension

      - name: Build extension zip
        run: |
          set -euo pipefail

          mkdir -p dist
          web-ext build \
            --source-dir build/extension \
            --artifacts-dir dist \
            --overwrite-dest

          mv dist/*.zip "dist/videospeed-firefox-${{ steps.extension.outputs.version }}.zip"

      - name: Submit to Firefox Add-ons Store (Listed)
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        run: |
          set -euo pipefail

          cat << 'EOF' > amo-metadata.json
          {
            "categories": ["photos-music-videos"],
            "version": {
              "license": "MIT"
            }
          }
          EOF

          web-ext sign \
            --source-dir build/extension \
            --artifacts-dir dist/listed \
            --channel listed \
            --api-key "${AMO_JWT_ISSUER}" \
            --api-secret "${AMO_JWT_SECRET}" \
            --amo-metadata amo-metadata.json

      - name: Build & Sign Unlisted .xpi for Direct Download
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        run: |
          set -euo pipefail

          # Create temporary copy for unlisted build
          mkdir -p build/unlisted-extension
          cp -r build/extension/* build/unlisted-extension/

          # Update version in manifest.json to append -unlisted suffix to prevent AMO conflict
          node -e '
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("build/unlisted-extension/manifest.json"));
            manifest.version = manifest.version + ".1";
            fs.writeFileSync("build/unlisted-extension/manifest.json", JSON.stringify(manifest, null, 2));
          '

          web-ext sign \
            --source-dir build/unlisted-extension \
            --artifacts-dir dist/unlisted \
            --channel unlisted \
            --api-key "${AMO_JWT_ISSUER}" \
            --api-secret "${AMO_JWT_SECRET}"

          signed_xpi="$(find dist/unlisted -maxdepth 1 -name '*.xpi' -print -quit)"
          if [ -n "${signed_xpi}" ]; then
            cp "${signed_xpi}" "dist/videospeed-firefox-${{ steps.extension.outputs.version }}-signed.xpi"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extension.outputs.version }}
          name: v${{ steps.extension.outputs.version }}
          files: |
            dist/*.zip
            dist/*.xpi
          generate_release_notes: true
          body: |
            Firefox extension release for version ${{ steps.extension.outputs.version }}.

            - **Store Release:** Submitted to Firefox Add-ons (AMO) for public listing review.
            - **Direct Install:** Download `videospeed-firefox-${{ steps.extension.outputs.version }}-signed.xpi` for standalone installation.
